<!DOCTYPE html>
<html lang="hi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="theme-color" content="#172033">

<title>Milo - Social App</title>

<style>
*{box-sizing:border-box}

body{
  margin:0;
  background:#080b12;
  color:white;
  font-family:Arial,sans-serif;
}

.app{
  max-width:430px;
  margin:auto;
  min-height:100vh;
  background:#0d111c;
  padding-bottom:75px;
}

header{
  height:60px;
  padding:15px 18px;
  display:flex;
  align-items:center;
  justify-content:space-between;
  font-size:24px;
  font-weight:bold;
}

.screen{
  display:none;
  padding:15px;
}

.screen.active{
  display:block;
}

.card{
  background:#151b2b;
  border-radius:15px;
  padding:15px;
  margin-bottom:15px;
}

.post img{
  width:100%;
  max-height:430px;
  object-fit:cover;
  border-radius:12px;
  margin-top:10px;
}

.post-actions{
  display:flex;
  gap:20px;
  margin-top:10px;
}

button{
  border:0;
  border-radius:10px;
  padding:10px 14px;
  cursor:pointer;
}

.action{
  background:none;
  color:white;
  font-size:16px;
}

input,textarea{
  width:100%;
  background:#20283a;
  color:white;
  border:1px solid #34405a;
  border-radius:10px;
  padding:12px;
  margin:8px 0;
}

textarea{
  height:100px;
  resize:none;
}

.upload{
  background:#7c5cff;
  color:white;
  width:100%;
  font-weight:bold;
}

nav{
  position:fixed;
  bottom:0;
  left:50%;
  transform:translateX(-50%);
  width:min(430px,100%);
  height:65px;
  background:#151b2b;
  display:flex;
  justify-content:space-around;
  align-items:center;
  border-top:1px solid #293249;
}

nav button{
  background:none;
  color:#aaa;
  font-size:13px;
}

nav button.active{
  color:#9b7cff;
}

.avatar{
  width:45px;
  height:45px;
  border-radius:50%;
  background:#7c5cff;
  display:inline-flex;
  align-items:center;
  justify-content:center;
  font-size:22px;
}

.username{
  margin-left:10px;
  font-weight:bold;
}

.empty{
  text-align:center;
  color:#888;
  padding:40px 10px;
}
</style>
</head>

<body>

<div class="app">

<header>
  <span>Milo</span>
  <span>•••</span>
</header>

<!-- HOME / FEED -->
<section id="home" class="screen active">

  <h2>Feed</h2>

  <div id="feed"></div>

  <div id="emptyFeed" class="empty">
    अभी कोई post नहीं है।<br>
    अपनी पहली post बनाओ! 😊
  </div>

</section>


<!-- SEARCH -->
<section id="search" class="screen">

  <h2>Search</h2>

  <input
    id="searchInput"
    type="text"
    placeholder="लोगों को खोजें..."
    oninput="searchPeople()"
  >

  <div id="searchResults"></div>

</section>


<!-- CREATE -->
<section id="create" class="screen">

  <h2>Create Post</h2>

  <div class="card">

    <label>फोटो चुनें</label>

    <input
      id="photoInput"
      type="file"
      accept="image/*"
      onchange="previewImage(event)"
    >

    <img
      id="preview"
      style="width:100%;border-radius:12px;display:none;margin-top:10px"
    >

    <textarea
      id="caption"
      placeholder="आप क्या सोच रहे हैं?"
    ></textarea>

    <button class="upload" onclick="uploadPost()">
      🚀 Post Upload करें
    </button>

  </div>

</section>


<!-- MESSAGES -->
<section id="messages" class="screen">

  <h2>Messages</h2>

  <div class="card">
    💬 अभी कोई message नहीं है।
  </div>

</section>


<!-- PROFILE -->
<section id="profile" class="screen">

  <div class="card">

    <div>
      <span class="avatar">👤</span>
      <span class="username">Milo User</span>
    </div>

    <hr>

    <p>Posts: <span id="postCount">0</span></p>
    <p>Followers: 0</p>
    <p>Following: 0</p>

  </div>

</section>


<!-- NAVIGATION -->
<nav>

  <button data-screen="home" class="active">
    🏠<br>Home
  </button>

  <button data-screen="search">
    🔍<br>Search
  </button>

  <button data-screen="create">
    ➕<br>Create
  </button>

  <button data-screen="messages">
    💬<br>Messages
  </button>

  <button data-screen="profile">
    👤<br>Profile
  </button>

</nav>

</div>


<script>

const screens = document.querySelectorAll(".screen");
const navButtons = document.querySelectorAll("nav button");


function show(id){

  screens.forEach(screen=>{
    screen.classList.toggle(
      "active",
      screen.id === id
    );
  });

  navButtons.forEach(button=>{
    button.classList.toggle(
      "active",
      button.dataset.screen === id
    );
  });

}


navButtons.forEach(button=>{

  button.onclick = () => {
    show(button.dataset.screen);
  };

});


/* PHOTO PREVIEW */

function previewImage(event){

  const file = event.target.files[0];

  if(!file) return;

  const reader = new FileReader();

  reader.onload = function(e){

    const preview = document.getElementById("preview");

    preview.src = e.target.result;
    preview.style.display = "block";

  };

  reader.readAsDataURL(file);

}


/* UPLOAD POST */

function uploadPost(){

  const input = document.getElementById("photoInput");
  const caption = document.getElementById("caption").value.trim();

  if(!input.files[0]){

    alert("पहले फोटो चुनो 📷");
    return;

  }

  const file = input.files[0];

  const reader = new FileReader();

  reader.onload = function(e){

    const post = {

      image:e.target.result,

      caption:caption,

      likes:0,

      time:new Date().toLocaleString()

    };


    const posts =
      JSON.parse(
        localStorage.getItem("miloPosts") || "[]"
      );


    posts.unshift(post);


    localStorage.setItem(
      "miloPosts",
      JSON.stringify(posts)
    );


    document.getElementById("photoInput").value="";
    document.getElementById("caption").value="";

    document.getElementById("preview").style.display="none";


    renderPosts();

    show("home");


    alert("Post successfully upload हो गई! 🎉");

  };

  reader.readAsDataURL(file);

}


/* SHOW POSTS */

function renderPosts(){

  const feed = document.getElementById("feed");

  const empty = document.getElementById("emptyFeed");

  const posts =
    JSON.parse(
      localStorage.getItem("miloPosts") || "[]"
    );


  feed.innerHTML="";


  if(posts.length === 0){

    empty.style.display="block";

    document.getElementById("postCount").textContent="0";

    return;

  }


  empty.style.display="none";


  document.getElementById("postCount").textContent =
    posts.length;


  posts.forEach((post,index)=>{

    const div = document.createElement("div");

    div.className="card post";


    div.innerHTML=`

      <div>
        <span class="avatar">👤</span>
        <span class="username">Milo User</span>
      </div>

      <img src="${post.image}">

      <div class="post-actions">

        <button
          class="action"
          onclick="likePost(${index})"
        >
          ❤️ ${post.likes}
        </button>

        <button class="action">
          💬 Comment
        </button>

      </div>

      <p>${escapeHTML(post.caption)}</p>

      <small>${post.time}</small>

    `;


    feed.appendChild(div);

  });

}


/* LIKE */

function likePost(index){

  const posts =
    JSON.parse(
      localStorage.getItem("miloPosts") || "[]"
    );


  posts[index].likes++;

  localStorage.setItem(
    "miloPosts",
    JSON.stringify(posts)
  );


  renderPosts();

}


/* SEARCH */

const people = [

  "Anjali Meena",
  "Rohit",
  "Priya",
  "Rahul",
  "Neha"

];


function searchPeople(){

  const q =
    document.getElementById("searchInput")
    .value
    .toLowerCase();


  const results =
    people.filter(name =>
      name.toLowerCase().includes(q)
    );


  document.getElementById("searchResults").innerHTML =

    results.map(name => `

      <div class="card">
        👤 ${name}
      </div>

    `).join("");

}


/* SECURITY */

function escapeHTML(text){

  return text
    .replace(/&/g,"&amp;")
    .replace(/</g,"&lt;")
    .replace(/>/g,"&gt;")
    .replace(/"/g,"&quot;")
    .replace(/'/g,"&#039;");

}


/* START */

renderPosts();


/* SERVICE WORKER */

if("serviceWorker" in navigator){

  navigator.serviceWorker.register("./sw.js")
    .catch(error =>
      console.log("SW error:",error)
    );

}

</script>

</body>
</html>
